# matrix values: [x, y, z,
#                 roll, pitch, yaw,
#                 vx, vy, vz,
#                 vroll, vpitch, vyaw,
#                 ax, ay, az]

ekf_filter_node_odom:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /autonomous/localization/odom/wheel
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, true,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10


ekf_filter_node_map:
  ros__parameters:
    frequency: 5.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # Local EKF output.
    # Fuse velocity/yaw-rate only. Do NOT fuse local x/y position.
    odom0: /autonomous/localization/odometry/local
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, true,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 2

    # GPS position from navsat_transform.
    # Fuse global x/y position only.
    odom1: /autonomous/localization/odometry/gps
    odom1_config: [
      true,  true,  false,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 2

    # Dual-GNSS heading.
    # Fuse global yaw only.
    imu0: /autonomous/localization/gps/heading
    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 2

navsat_transform:
  ros__parameters:
    frequency: 5.0
    use_odometry_yaw: false

    wait_for_datum: false
    delay: 5.0

    # in case of issues try -1.5707963 (pi/2)
    yaw_offset: 0.0
    magnetic_declination_radians: 0.0
    zero_altitude: false

    publish_filtered_gps: false

    broadcast_utm_transform: true
    broadcast_utm_transform_as_parent_frame: false